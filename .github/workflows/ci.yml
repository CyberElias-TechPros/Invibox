name: Validate
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate:local
      - name: Full-stack smoke test
        run: |
          npm run worker:dev > /tmp/worker.log 2>&1 &
          npm run dev > /tmp/vite.log 2>&1 &
          npx wait-on http-get://localhost:8787/api/v1/health http-get://localhost:5173
          npm run smoke
      - run: npm run build
      - run: npx wrangler deploy --dry-run
